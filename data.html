<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>T2K Group - Signal Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Heat Plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
  // Initialize map
  const map = L.map("map").setView([50.36701, -4.1525], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  let heatLayer = null;
  const stationLayer = L.layerGroup().addTo(map);

  function parseJSONPoints(data) {
    return data
      .map(str => str.split(",").map(Number))
      .filter(coord => !isNaN(coord[0]) && !isNaN(coord[1]));
  }

  const files = [
    "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/celldata0.json",
    "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/celldata1.json",
    "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/celldata2.json",
    "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/celldata3.json",
    "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/celldata4.json"
  ];

  // ✅ THIS WAS MISSING
  async function loadHeatmap() {
    let allPoints = [];

    for (const file of files) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        for (const pt of parseJSONPoints(json)) {
          allPoints.push(pt);
}
      } catch (err) {
        console.warn(`Failed to load ${file}`, err);
      }
    }

    if (heatLayer) map.removeLayer(heatLayer);

    heatLayer = L.heatLayer(allPoints, {
      radius: 18,
      blur: 10,
      maxZoom: 17,
      gradient: {
        0.0: "rgba(0, 255, 255, 0.05)", // very transparent cyan
        0.5: "rgba(0, 255, 0, 0.05)",    // very transparent green
      }
    }).addTo(map);


    if (allPoints.length) {
      map.fitBounds(allPoints);
    }
  }

  async function loadStations() {
    try {
      const res = await fetch(
        "https://raw.githubusercontent.com/T2K-Group/t2k-group.github.io/main/stationsdata.json"
      );
      const json = await res.json();
      const points = parseJSONPoints(json);

      stationLayer.clearLayers();

      points.forEach(([lat, lng]) => {
        L.circleMarker([lat, lng], {
          radius: 6,
          color: "#000",
          weight: 1,
          fillColor: "#00f",
          fillOpacity: 0.9
        }).addTo(stationLayer);
      });
    } catch (err) {
      console.error("Failed to load stationsdata.json", err);
    }
  }

  const legend = L.control({ position: "bottomright" });

    legend.onAdd = function (map) {
      const div = L.DomUtil.create("div", "info legend");
      div.style.background = "white";
      div.style.padding = "6px";
      div.style.border = "1px solid #ccc";
      div.style.borderRadius = "4px";
      div.innerHTML = `
        <h4>Map Key</h4>
        <div><span style="display:inline-block;width:12px;height:12px;background:#0000ff;margin-right:4px;"></span> Station</div>
        <div><span style="display:inline-block;width:12px;height:12px;background:rgba(0,255,0,0.5);margin-right:4px;"></span> Signal</div>
      `;
      return div;
    };

    legend.addTo(map);



  loadHeatmap();
  loadStations();
</script>

</body>
</html>
