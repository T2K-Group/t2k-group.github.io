<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaflet JSON Heatmap</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Heat Plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <script>
    // Initialize map
    const map = L.map("map").setView([50.36701, -4.1525], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    let heatLayer = null;
    const stationLayer = L.layerGroup().addTo(map);

    // Convert ["lat,lng", ...] → [[lat, lng], ...]
    function parseJSONPoints(data) {
      return data
        .map(str => str.split(",").map(Number))
        .filter(coord => !isNaN(coord[0]) && !isNaN(coord[1]));
    }

    // Load multiple heatmap JSON files
    async function loadHeatmap() {
      const files = [
        "celldata0.json",
        "celldata1.json",
        "celldata2.json",
        "celldata3.json",
        "celldata4.json"
      ];

      let allPoints = [];

      for (const file of files) {
        try {
          const res = await fetch(file);
          const json = await res.json();
          allPoints.push(...parseJSONPoints(json));
        } catch (err) {
          console.warn(`Failed to load ${file}`, err);
        }
      }

      if (heatLayer) map.removeLayer(heatLayer);

      heatLayer = L.heatLayer(allPoints, {
        radius: 18,
        blur: 10,
        maxZoom: 17,
        minOpacity: 0.5,
        gradient: {
          0.0: "#00ffff",
          0.2: "#00ff00",
          0.4: "#ffff00",
          0.6: "#ff9900",
          0.8: "#ff0000",
          1.0: "#800000"
        }
      }).addTo(map);

      if (allPoints.length) {
        map.fitBounds(allPoints);
      }
    }

    // Load station JSON
    async function loadStations() {
      try {
        const res = await fetch("stationsdata.json");
        const json = await res.json();
        const points = parseJSONPoints(json);

        stationLayer.clearLayers();

        points.forEach(([lat, lng]) => {
          L.circleMarker([lat, lng], {
            radius: 6,
            color: "#000",
            weight: 1,
            fillColor: "#00f",
            fillOpacity: 0.9
          }).addTo(stationLayer);
        });
      } catch (err) {
        console.error("Failed to load stationsdata.json", err);
      }
    }

    // Load everything
    loadHeatmap();
    loadStations();
  </script>

</body>
</html>
